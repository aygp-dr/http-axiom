name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# least privilege for GITHUB_TOKEN (L7 C1)
permissions:
  contents: read

jobs:
  check:
    name: todo-clj (bb check)
    runs-on: ubuntu-latest
    # the Clojure example is its own project root (aygp-dr clojure standard v1)
    defaults:
      run:
        working-directory: examples/todo-clj
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: latest
          bb: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ runner.os }}-todo-clj-${{ hashFiles('examples/todo-clj/deps.edn', 'examples/todo-clj/bb.edn') }}
          restore-keys: clj-${{ runner.os }}-todo-clj-
      - run: bb check
